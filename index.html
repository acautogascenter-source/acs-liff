<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>ACS LINE Bridge</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f7f8;color:#222}
    .box{max-width:520px;margin:40px auto;background:#fff;padding:28px 22px;border-radius:18px;box-shadow:0 5px 24px rgba(0,0,0,.08)}
    h2{margin:0 0 8px}
    p{line-height:1.6}
    button{width:100%;border:0;border-radius:10px;padding:15px;background:#06c755;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #status{margin-top:18px;padding:14px;border-radius:10px;background:#f1f3f4;line-height:1.7;white-space:pre-wrap;word-break:break-word}
    .ok{background:#e8f8ee!important;color:#087a35}
    .err{background:#fff0f0!important;color:#b00000}
    .info{background:#eef7ff!important;color:#155a86}
    .small{font-size:13px;color:#666;margin-top:14px}
  </style>
</head>
<body>
<div class="box">
  <h2>💚 ACS LINE</h2>
  <p>เชื่อมต่อ LINE เพื่อใช้ข้อมูล LINE User ID กับระบบจองคิว</p>
  <button id="connectBtn" type="button">เชื่อมต่อ LINE</button>
  <div id="status">ยังไม่ได้เชื่อมต่อ LINE</div>
  <div class="small">หากเปิดจาก Chrome ระบบจะพาไป LINE Login แล้วกลับมาหน้านี้อัตโนมัติ</div>
</div>

<script>
const LIFF_ID = "2011246207-sX1HgP1s";
const GAS_API = "https://script.google.com/macros/s/AKfycbwztzUCGN0AUy8bXUzG96o60Prt5hoMhZnght_xrlgC2lWfoEvszod_hYV28G8n9qOtuQ/exec";

const btn = document.getElementById("connectBtn");
const statusEl = document.getElementById("status");
let liffInitialized = false;

function status(message, type) {
  statusEl.textContent = message;
  statusEl.className = type || "";
}

function redirectUri() {
  return window.location.origin + window.location.pathname;
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function initLiffWithTimeout() {
  if (liffInitialized) return;
  if (typeof liff === "undefined") throw new Error("ไม่พบ LINE LIFF SDK");

  const initPromise = liff.init({ liffId: LIFF_ID });
  const timeoutPromise = new Promise((_, reject) => {
    setTimeout(() => reject(new Error("LIFF init timeout 20 วินาที")), 20000);
  });

  await Promise.race([initPromise, timeoutPromise]);
  liffInitialized = true;
}

async function connectLINE() {
  btn.disabled = true;

  try {
    status("1. กำลังเริ่ม LIFF...", "info");
    await initLiffWithTimeout();

    console.log("LIFF initialized", {
      liffId: LIFF_ID,
      isInClient: liff.isInClient(),
      isLoggedIn: liff.isLoggedIn(),
      redirectUri: redirectUri()
    });

    if (!liff.isLoggedIn()) {
      status("2. กำลังเปิด LINE Login...", "info");

      /*
       * สำคัญ: LIFF Endpoint URL ใน LINE Developers
       * ต้องตั้งเป็น GitHub Pages URL เดียวกับหน้านี้
       */
      liff.login({ redirectUri: redirectUri() });
      return;
    }

    status("3. Login สำเร็จ กำลังอ่าน LINE User ID...", "info");

    const idToken = liff.getIDToken();
    if (!idToken) throw new Error("ไม่พบ ID Token จาก LIFF");

    const profile = await liff.getProfile();
    if (!profile || !profile.userId) {
      throw new Error("ไม่สามารถอ่าน LINE User ID ได้");
    }

    const payload = {
      action: "saveLineUser",
      idToken: idToken,
      userId: profile.userId,
      displayName: profile.displayName || "",
      pictureUrl: profile.pictureUrl || "",
      source: "github-liff-bridge",
      timestamp: new Date().toISOString()
    };

    console.log("LINE profile:", profile);
    status("4. กำลังบันทึกข้อมูล LINE ลง Google Sheet...", "info");

    /*
     * ใช้ text/plain + no-cors เพื่อไม่ให้ Browser ส่ง CORS preflight
     * Apps Script จะรับ JSON ใน doPost(e)
     */
    await fetch(GAS_API, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    status(
      "5. เชื่อมต่อ LINE สำเร็จ ✅\n\n" +
      "ชื่อ: " + (profile.displayName || "-") + "\n\n" +
      "LINE User ID:\n" + profile.userId + "\n\n" +
      "ส่งข้อมูลไปยังระบบแล้ว",
      "ok"
    );

  } catch (err) {
    console.error("LINE ERROR", err);
    status(
      "LINE เชื่อมต่อไม่สำเร็จ\n\n" +
      (err && err.message ? err.message : String(err)) +
      "\n\nLIFF ID: " + LIFF_ID +
      "\nหน้านี้: " + redirectUri(),
      "err"
    );
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", connectLINE);

window.addEventListener("load", () => {
  console.log("ACS LINE Bridge loaded");
  console.log("LIFF_ID =", LIFF_ID);
  console.log("GAS_API =", GAS_API);
  console.log("LIFF Endpoint expected =", redirectUri());
});
</script>
</body>
</html>
