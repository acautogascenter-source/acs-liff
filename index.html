<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACS LINE Bridge</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f3f7f5;

      color: #222;

    }


    .box {

      max-width: 600px;

      margin: 30px auto;

      background: white;

      padding: 30px;

      border-radius: 20px;

      box-shadow:
        0 5px 25px rgba(0,0,0,.08);

    }


    h1 {

      margin-top: 0;

      font-size: 30px;

    }


    p {

      font-size: 20px;

      line-height: 1.6;

    }


    button {

      width: 100%;

      padding: 18px;

      margin-top: 15px;

      border: 0;

      border-radius: 12px;

      background: #06c755;

      color: white;

      font-size: 22px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: .6;

      cursor: wait;

    }


    #status {

      margin-top: 25px;

      padding: 20px;

      border-radius: 12px;

      background: #f5f5f5;

      font-size: 19px;

      line-height: 1.7;

      word-break: break-word;

      white-space: pre-wrap;

    }


    .success {

      background: #e8f8ee !important;

      color: #087f3d;

    }


    .error {

      background: #fff0f0 !important;

      color: #c00000;

    }


    .loading {

      background: #fff8e5 !important;

      color: #805d00;

    }


    .small {

      margin-top: 20px;

      color: #777;

      font-size: 15px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


<div class="box">

  <h1>💚 ACS LINE</h1>


  <p>

    เชื่อมต่อ LINE เพื่อใช้ข้อมูล LINE User ID

    กับระบบจองคิว

  </p>


  <button
    id="connectBtn"
    onclick="connectLINE()"
  >

    เชื่อมต่อ LINE

  </button>


  <div id="status">

    กำลังตรวจสอบระบบ...

  </div>


  <div class="small">

    LIFF ID:
    2011246207-sX1HgP1s

  </div>

</div>



<script>


/************************************************************
 * CONFIG
 ************************************************************/

const LIFF_ID =
  "2011246207-sX1HgP1s";


const GAS_API =
  "https://script.google.com/macros/s/AKfycbwztzUCGN0AUy8bXUzG96o60Prt5hoMhZnght_xrlgC2lWfoEvszod_hYv28G8n9qOtuQ/exec";



/************************************************************
 * ELEMENT
 ************************************************************/

const statusEl =
  document.getElementById(
    "status"
  );


const connectBtn =
  document.getElementById(
    "connectBtn"
  );



/************************************************************
 * STATUS
 ************************************************************/

function setStatus(
  message,
  type = ""
) {

  statusEl.textContent =
    message;

  statusEl.className =
    "";

  if (type) {

    statusEl.classList.add(
      type
    );

  }

}



/************************************************************
 * WAIT
 ************************************************************/

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}



/************************************************************
 * LIFF INIT WITH TIMEOUT
 ************************************************************/

async function initLIFF() {

  if (
    window.__liffInitialized
  ) {

    return true;

  }


  if (
    window.__liffInitializing
  ) {

    return window.__liffInitializing;

  }


  window.__liffInitializing =
    Promise.race([

      liff.init({
        liffId: LIFF_ID
      }),

      new Promise(
        (_, reject) => {

          setTimeout(
            () => {

              reject(
                new Error(
                  "LIFF init timeout 20 วินาที"
                )
              );

            },
            20000
          );

        }
      )

    ])
    .then(() => {

      window.__liffInitialized =
        true;

      return true;

    })
    .catch(error => {

      window.__liffInitializing =
        null;

      throw error;

    });


  return window.__liffInitializing;

}



/************************************************************
 * CONNECT LINE
 ************************************************************/

async function connectLINE() {

  connectBtn.disabled =
    true;


  try {


    /******************************************************
     * STEP 1
     ******************************************************/

    setStatus(
      "1. กำลังเริ่ม LINE LIFF...",
      "loading"
    );


    await initLIFF();


    console.log(
      "LIFF initialized"
    );


    console.log(
      "isInClient:",
      liff.isInClient()
    );


    console.log(
      "isLoggedIn:",
      liff.isLoggedIn()
    );



    /******************************************************
     * STEP 2
     ******************************************************/

    if (
      !liff.isLoggedIn()
    ) {

      setStatus(
        "2. กำลังเปิด LINE Login...\n\n" +
        "หลัง Login แล้วระบบจะกลับมาหน้านี้อัตโนมัติ",
        "loading"
      );


      liff.login({
        redirectUri:
          window.location.href
      });


      return;

    }



    /******************************************************
     * STEP 3
     ******************************************************/

    setStatus(
      "3. LINE Login สำเร็จ\n" +
      "กำลังอ่านข้อมูล LINE...",
      "loading"
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "ไม่พบ ID Token จาก LIFF"
      );

    }


    console.log(
      "ID Token received:",
      !!idToken
    );



    /******************************************************
     * STEP 4
     ******************************************************/

    setStatus(
      "4. กำลังอ่าน LINE User ID...",
      "loading"
    );


    let profile;


    try {

      profile =
        await liff.getProfile();

    } catch (profileError) {

      console.error(
        "getProfile error:",
        profileError
      );

      throw new Error(
        "ไม่สามารถอ่าน LINE Profile ได้"
      );

    }


    const userId =
      profile &&
      profile.userId
        ? profile.userId
        : "";


    const displayName =
      profile &&
      profile.displayName
        ? profile.displayName
        : "";


    if (!userId) {

      throw new Error(
        "ไม่พบ LINE User ID"
      );

    }


    console.log(
      "LINE User ID:",
      userId
    );


    console.log(
      "Display Name:",
      displayName
    );



    /******************************************************
     * STEP 5
     *
     * ใช้ GET แทน POST
     ******************************************************/

    setStatus(
      "5. กำลังบันทึก LINE User ID ลงระบบ...",
      "loading"
    );


    const query =
      new URLSearchParams({

        action:
          "saveLineUser",

        userId:
          userId,

        displayName:
          displayName,

        idToken:
          idToken,

        source:
          "github-liff-bridge"

      });


    const requestUrl =
      GAS_API +
      "?" +
      query.toString();


    console.log(
      "Sending to GAS..."
    );


    /*
     * GET request
     *
     * ไม่ใช้ no-cors
     * เพื่อให้เราอ่านผลตอบกลับจาก Apps Script ได้
     */

    const response =
      await fetch(
        requestUrl,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Apps Script HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "GAS result:",
      result
    );


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Apps Script ไม่สามารถบันทึกข้อมูลได้"
      );

    }



    /******************************************************
     * STEP 6
     ******************************************************/

    setStatus(

      "6. เชื่อมต่อ LINE สำเร็จ ✅\n\n" +

      "ชื่อ: " +
      displayName +

      "\n\n" +

      "LINE User ID:\n" +
      userId +

      "\n\n" +

      "บันทึกลง LINE_USERS แล้ว\n" +

      "แถวที่: " +
      result.row,

      "success"

    );


    console.log(
      "LINE USER SAVED:",
      result
    );


  } catch (error) {

    console.error(
      "LINE ERROR:",
      error
    );


    setStatus(

      "LINE เชื่อมต่อไม่สำเร็จ\n\n" +

      (error.message ||
       String(error)) +

      "\n\n" +

      "กรุณากดปุ่มเชื่อมต่อ LINE อีกครั้ง",

      "error"

    );


    connectBtn.disabled =
      false;

  }

}



/************************************************************
 * AUTO CHECK
 ************************************************************/

window.addEventListener(
  "load",
  async function() {

    console.log(
      "ACS LINE Bridge loaded"
    );

    console.log(
      "LIFF ID:",
      LIFF_ID
    );

    console.log(
      "GAS API:",
      GAS_API
    );


    setStatus(
      "พร้อมเชื่อมต่อ LINE",
      ""
    );

  }
);


</script>


</body>

</html>
