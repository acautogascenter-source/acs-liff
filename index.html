<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACS LINE Bridge</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 30px 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f4f8f6;

      text-align: center;

    }


    .box {

      max-width: 600px;

      margin: 40px auto;

      background: white;

      padding: 35px 25px;

      border-radius: 20px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,.10);

    }


    h1 {

      margin-top: 0;

      font-size: 32px;

    }


    p {

      font-size: 20px;

      line-height: 1.6;

    }


    button {

      width: 100%;

      padding: 18px;

      border: 0;

      border-radius: 12px;

      background: #06c755;

      color: white;

      font-size: 22px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: .6;

    }


    #status {

      margin-top: 25px;

      padding: 20px;

      border-radius: 15px;

      background: #f5f5f5;

      font-size: 18px;

      line-height: 1.7;

      word-break: break-word;

      white-space: pre-wrap;

      text-align: left;

    }


    .success {

      background: #e7f8ed !important;

      color: #087c3d;

    }


    .error {

      background: #fff0f0 !important;

      color: #c00000;

    }

  </style>

</head>


<body>


<div class="box">

  <h1>💚 ACS LINE</h1>

  <p>
    เชื่อมต่อ LINE เพื่อใช้ข้อมูล LINE User ID
    กับระบบจองคิว
  </p>


  <button
    id="connectBtn"
    onclick="connectLINE()"
  >
    เชื่อมต่อ LINE
  </button>


  <div id="status">
    ยังไม่ได้เชื่อมต่อ LINE
  </div>

</div>


<script>


/************************************************************
 * CONFIG
 ************************************************************/

const LIFF_ID =
  "2011246207-sX1HgP1s";


const GAS_API =
  "https://script.google.com/macros/s/AKfycbwztzUCGN0AUy8bXUzG96o60Prt5hoMhZnght_xrlgC2lWfoEvszod_hYv28G8n9qOtuQ/exec";


/************************************************************
 * ELEMENT
 ************************************************************/

const statusEl =
  document.getElementById(
    "status"
  );


const connectBtn =
  document.getElementById(
    "connectBtn"
  );


/************************************************************
 * STATUS
 ************************************************************/

function setStatus(
  message,
  type
) {

  statusEl.textContent =
    message;

  statusEl.className =
    "";


  if (type) {

    statusEl.classList.add(
      type
    );

  }

}


/************************************************************
 * SEND TO GAS
 ************************************************************/

async function sendToGAS(payload) {

  /*
   * ใช้ POST text/plain
   * เพื่อไม่ให้เกิด CORS preflight
   */

  const response =
    await fetch(
      GAS_API,
      {

        method: "POST",

        mode: "cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if (!response.ok) {

    throw new Error(
      "Apps Script HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  console.log(
    "Apps Script response:",
    text
  );


  let result;


  try {

    result =
      JSON.parse(text);

  } catch (error) {

    throw new Error(
      "Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON"
    );

  }


  if (!result.success) {

    throw new Error(
      result.error ||
      "Apps Script ไม่สามารถบันทึกข้อมูลได้"
    );

  }


  return result;

}


/************************************************************
 * CONNECT LINE
 ************************************************************/

async function connectLINE() {

  connectBtn.disabled =
    true;


  try {


    /******************************************************
     * STEP 1
     ******************************************************/

    setStatus(
      "1. กำลังเริ่ม LIFF..."
    );


    await liff.init({

      liffId:
        LIFF_ID

    });


    console.log(
      "LIFF initialized"
    );


    console.log(
      "isLoggedIn:",
      liff.isLoggedIn()
    );


    console.log(
      "isInClient:",
      liff.isInClient()
    );


    /******************************************************
     * STEP 2
     ******************************************************/

    if (!liff.isLoggedIn()) {

      setStatus(
        "2. กำลังเปิด LINE Login..."
      );


      liff.login({

        redirectUri:
          window.location.href

      });


      return;

    }


    /******************************************************
     * STEP 3
     ******************************************************/

    setStatus(
      "3. Login สำเร็จ\nกำลังอ่านข้อมูล LINE..."
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "ไม่พบ ID Token จาก LIFF"
      );

    }


    /******************************************************
     * STEP 4
     ******************************************************/

    setStatus(
      "4. กำลังอ่าน LINE User ID..."
    );


    const profile =
      await liff.getProfile();


    const userId =
      profile.userId || "";


    const displayName =
      profile.displayName || "";


    if (!userId) {

      throw new Error(
        "ไม่สามารถอ่าน LINE User ID ได้"
      );

    }


    console.log(
      "LINE User ID:",
      userId
    );


    console.log(
      "Display Name:",
      displayName
    );


    /******************************************************
     * STEP 5
     ******************************************************/

    setStatus(
      "5. กำลังบันทึก LINE User ID ลงระบบ..."
    );


    const payload = {

      action:
        "saveLineUser",

      userId:
        userId,

      displayName:
        displayName,

      idToken:
        idToken,

      source:
        "github-liff-bridge",

      timestamp:
        new Date().toISOString()

    };


    console.log(
      "Sending:",
      payload
    );


    /******************************************************
     * STEP 6
     ******************************************************/

    const result =
      await sendToGAS(
        payload
      );


    console.log(
      "GAS result:",
      result
    );


    /******************************************************
     * SUCCESS
     ******************************************************/

    setStatus(

      "6. เชื่อมต่อ LINE สำเร็จ ✅\n\n" +

      "ชื่อ: " +
      displayName +
      "\n\n" +

      "LINE User ID:\n" +
      userId +
      "\n\n" +

      "บันทึกลง LINE_USERS แล้ว\n" +

      "สถานะ: " +
      result.action,

      "success"

    );


    connectBtn.disabled =
      false;


  } catch (error) {

    console.error(
      "LINE ERROR:",
      error
    );


    setStatus(

      "LINE เชื่อมต่อไม่สำเร็จ\n\n" +

      error.message,

      "error"

    );


    connectBtn.disabled =
      false;

  }

}


/************************************************************
 * LOAD
 ************************************************************/

window.addEventListener(
  "load",
  function() {

    console.log(
      "ACS LINE Bridge loaded"
    );

    console.log(
      "LIFF ID:",
      LIFF_ID
    );

    console.log(
      "GAS API:",
      GAS_API
    );

  }
);


</script>

</body>

</html>
