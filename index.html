<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACS LINE Bridge</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
      background: #f5f7f8;
      color: #333;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow:
        0 4px 20px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #06c755;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f5f5f5;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
      text-align: left;
    }

    .success {
      background: #e8f8ee !important;
      color: #087f35;
    }

    .error {
      background: #fff0f0 !important;
      color: #c00000;
    }

    .info {
      background: #eef7ff !important;
      color: #155a8a;
    }

  </style>
</head>


<body>

  <div class="box">

    <h2>💚 ACS LINE</h2>

    <p>
      เชื่อมต่อ LINE เพื่อใช้งานระบบจองคิว
    </p>

    <button
      id="connectBtn"
      type="button"
      onclick="connectLINE()"
    >
      เชื่อมต่อ LINE
    </button>

    <div id="status">
      ยังไม่ได้เชื่อมต่อ LINE
    </div>

  </div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const LIFF_ID =
  "2011246207-sX1HgP1s";


/*
 * สำคัญมาก
 * URL นี้ต้องเป็น Web App ของ Code.gs
 */
const GAS_API =
  "https://script.google.com/macros/s/AKfycbwztzUCGN0AUy8bXUzG96o60Prt5hoMhZnght_xrlgC2lWfoEvszod_hYV28G8n9qOtuQ/exec";


/* =========================================================
   ELEMENT
========================================================= */

const statusEl =
  document.getElementById("status");

const connectBtn =
  document.getElementById("connectBtn");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, type) {

  statusEl.textContent = message;

  statusEl.className = "";

  if (type) {
    statusEl.classList.add(type);
  }

}


/* =========================================================
   GET REDIRECT URL
========================================================= */

function getRedirectUri() {

  /*
   * ใช้ URL ของ GitHub Pages ปัจจุบัน
   * ไม่ส่ง query/hash เก่ากลับเข้า LIFF
   */

  return (
    window.location.origin +
    window.location.pathname
  );

}


/* =========================================================
   SEND DATA TO GAS
========================================================= */

async function sendToGAS(payload) {

  /*
   * ใช้ text/plain
   * เพื่อหลีกเลี่ยง CORS preflight
   */

  await fetch(
    GAS_API,
    {
      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(payload)
    }
  );

}


/* =========================================================
   CONNECT LINE
========================================================= */

async function connectLINE() {

  connectBtn.disabled = true;

  try {

    /* -----------------------------------------------------
       STEP 1
    ----------------------------------------------------- */

    setStatus(
      "1. กำลังเริ่ม LIFF...",
      "info"
    );


    console.log(
      "LIFF ID:",
      LIFF_ID
    );

    console.log(
      "GAS API:",
      GAS_API
    );


    /* -----------------------------------------------------
       STEP 2
       INIT LIFF
    ----------------------------------------------------- */

    await liff.init({
      liffId: LIFF_ID
    });


    console.log(
      "LIFF initialized"
    );

    console.log(
      "isLoggedIn:",
      liff.isLoggedIn()
    );

    console.log(
      "isInClient:",
      liff.isInClient()
    );


    /* -----------------------------------------------------
       STEP 3
       LOGIN
    ----------------------------------------------------- */

    if (!liff.isLoggedIn()) {

      setStatus(
        "2. กำลังเปิด LINE Login...",
        "info"
      );

      const redirectUri =
        getRedirectUri();

      console.log(
        "redirectUri:",
        redirectUri
      );


      liff.login({
        redirectUri: redirectUri
      });

      return;
    }


    /* -----------------------------------------------------
       STEP 4
       ID TOKEN
    ----------------------------------------------------- */

    setStatus(
      "3. Login สำเร็จ\nกำลังอ่านข้อมูล LINE...",
      "info"
    );


    const idToken =
      liff.getIDToken();


    console.log(
      "ID Token exists:",
      !!idToken
    );


    if (!idToken) {

      throw new Error(
        "ไม่พบ ID Token จาก LIFF"
      );

    }


    /* -----------------------------------------------------
       STEP 5
       PROFILE
    ----------------------------------------------------- */

    setStatus(
      "4. กำลังอ่าน LINE User ID...",
      "info"
    );


    let profile = null;


    try {

      profile =
        await liff.getProfile();

      console.log(
        "LINE profile:",
        profile
      );

    } catch (profileError) {

      console.error(
        "getProfile error:",
        profileError
      );

      throw new Error(
        "ไม่สามารถอ่านข้อมูล LINE Profile ได้"
      );

    }


    const userId =
      profile &&
      profile.userId
        ? profile.userId
        : "";


    const displayName =
      profile &&
      profile.displayName
        ? profile.displayName
        : "";


    const pictureUrl =
      profile &&
      profile.pictureUrl
        ? profile.pictureUrl
        : "";


    console.log(
      "LINE User ID:",
      userId
    );

    console.log(
      "LINE Display Name:",
      displayName
    );


    if (!userId) {

      throw new Error(
        "ไม่สามารถอ่าน LINE User ID ได้"
      );

    }


    /* -----------------------------------------------------
       STEP 6
       SAVE TO GOOGLE APPS SCRIPT
    ----------------------------------------------------- */

    setStatus(
      "5. กำลังบันทึกข้อมูล LINE ลงระบบ...",
      "info"
    );


    const payload = {

      action:
        "saveLineUser",

      idToken:
        idToken,

      userId:
        userId,

      displayName:
        displayName,

      pictureUrl:
        pictureUrl,

      source:
        "github-liff-bridge",

      timestamp:
        new Date().toISOString()

    };


    console.log(
      "Sending payload:",
      payload
    );


    await sendToGAS(
      payload
    );


    /* -----------------------------------------------------
       STEP 7
       SUCCESS
    ----------------------------------------------------- */

    setStatus(

      "6. เชื่อมต่อ LINE สำเร็จ ✅\n\n" +

      "ชื่อ: " +
      displayName +
      "\n\n" +

      "LINE User ID:\n" +
      userId +
      "\n\n" +

      "บันทึกข้อมูลเข้าสู่ระบบแล้ว",

      "success"

    );


    console.log(
      "LINE connection completed"
    );


    /*
     * ไม่ redirect ทันที
     * เพื่อให้ตรวจสอบผลบนหน้าจอก่อนได้
     */

    connectBtn.disabled = false;


  } catch (error) {

    console.error(
      "LINE ERROR:",
      error
    );


    setStatus(

      "LINE เชื่อมต่อไม่สำเร็จ\n\n" +

      (
        error &&
        error.message
          ? error.message
          : String(error)
      ),

      "error"

    );


    connectBtn.disabled = false;

  }

}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
  "load",
  function() {

    console.log(
      "================================"
    );

    console.log(
      "ACS LINE Bridge Loaded"
    );

    console.log(
      "LIFF ID:",
      LIFF_ID
    );

    console.log(
      "GAS API:",
      GAS_API
    );

    console.log(
      "Current URL:",
      window.location.href
    );

    console.log(
      "Redirect URL:",
      getRedirectUri()
    );

    console.log(
      "================================"
    );

  }
);

</script>

</body>
</html>
