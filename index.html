<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACS LINE Bridge</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px 20px;
      text-align: center;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #06c755;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 20px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .success {
      color: #008f3c;
    }

    .error {
      color: #d00000;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>ACS LINE</h2>

  <p>เชื่อมต่อ LINE เพื่อใช้งานระบบจองคิว</p>

  <button
    id="connectBtn"
    onclick="connectLINE()"
  >
    เชื่อมต่อ LINE
  </button>

  <div id="status">
    ยังไม่ได้เชื่อมต่อ LINE
  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const LIFF_ID =
  "2011246207-sX1HgP1s";


const GAS_API =
  "const GAS_API =
  "https://script.google.com/macros/s/AKfycbwztzUCGN0AUy8bXUzG96o60Prt5hoMhZnght_xrlgC2lWfoEvszod_hYv28G8n9qOtuQ/exec";


/* =========================================================
   ELEMENTS
========================================================= */

const statusEl =
  document.getElementById("status");

const connectBtn =
  document.getElementById("connectBtn");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, type) {

  statusEl.textContent = message;

  statusEl.className = "";

  if (type) {
    statusEl.classList.add(type);
  }

}


/* =========================================================
   MAIN
========================================================= */

async function connectLINE() {

  connectBtn.disabled = true;

  try {

    setStatus(
      "1. กำลังเริ่ม LIFF...",
      ""
    );


    /* -----------------------------------------------------
       LIFF INIT
    ----------------------------------------------------- */

    await liff.init({
      liffId: LIFF_ID
    });


    console.log(
      "LIFF initialized"
    );

    console.log(
      "LIFF ID:",
      LIFF_ID
    );

    console.log(
      "isLoggedIn:",
      liff.isLoggedIn()
    );

    console.log(
      "isInClient:",
      liff.isInClient()
    );


    /* -----------------------------------------------------
       LOGIN
    ----------------------------------------------------- */

    if (!liff.isLoggedIn()) {

      setStatus(
        "2. กำลังเปิด LINE Login...",
        ""
      );

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    /* -----------------------------------------------------
       GET ID TOKEN
    ----------------------------------------------------- */

    setStatus(
      "3. Login สำเร็จ กำลังอ่านข้อมูล LINE...",
      ""
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "ไม่พบ ID Token จาก LIFF"
      );

    }


    console.log(
      "ID Token exists:",
      !!idToken
    );


    /* -----------------------------------------------------
       GET PROFILE
    ----------------------------------------------------- */

    setStatus(
      "4. กำลังอ่าน LINE User ID...",
      ""
    );


    let profile = null;

    try {

      profile =
        await liff.getProfile();

      console.log(
        "LINE profile:",
        profile
      );

    } catch (profileError) {

      console.warn(
        "getProfile error:",
        profileError
      );

    }


    const userId =
      profile && profile.userId
        ? profile.userId
        : "";


    const displayName =
      profile && profile.displayName
        ? profile.displayName
        : "";


    console.log(
      "LINE User ID:",
      userId
    );


    if (!userId) {

      throw new Error(
        "ไม่สามารถอ่าน LINE User ID ได้"
      );

    }


    /* -----------------------------------------------------
       SEND TO GOOGLE APPS SCRIPT
    ----------------------------------------------------- */

    setStatus(
      "5. กำลังบันทึกข้อมูลลงระบบ...",
      ""
    );


    const payload = {

      action: "saveLineUser",

      idToken: idToken,

      userId: userId,

      displayName: displayName,

      source: "github-liff-bridge",

      timestamp:
        new Date().toISOString()

    };


    console.log(
      "Sending payload:",
      payload
    );


    /*
      ใช้ text/plain เพื่อไม่ให้ browser
      ทำ CORS preflight OPTIONS request
    */

    await fetch(
      GAS_API,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );


    /* -----------------------------------------------------
       SUCCESS
    ----------------------------------------------------- */

    setStatus(
      "6. เชื่อมต่อ LINE สำเร็จ ✅\n\n" +
      "LINE User ID:\n" +
      userId +
      "\n\n" +
      "สามารถกลับไปใช้งานระบบจองคิวได้",
      "success"
    );


    console.log(
      "LINE connection completed"
    );


  } catch (error) {

    console.error(
      "LINE ERROR:",
      error
    );


    setStatus(
      "LINE เชื่อมต่อไม่สำเร็จ\n\n" +
      (error.message || error),
      "error"
    );


    connectBtn.disabled = false;

  }

}


/* =========================================================
   AUTO INIT CHECK
========================================================= */

window.addEventListener(
  "load",
  async function() {

    try {

      console.log(
        "ACS LINE Bridge loaded"
      );

      console.log(
        "LIFF ID:",
        LIFF_ID
      );

      console.log(
        "GAS API:",
        GAS_API
      );

    } catch (error) {

      console.error(error);

    }

  }
);

</script>

</body>
</html>
