<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

const LIFF_ID =
  "2011246207-sX1HgP1s";

const GAS_API =
  "https://script.google.com/macros/s/AKfycbzfIPLZtisD645c6_-meYghd6qRfT-DUNIA10TQhKXyDJzAkLUEiR5lC-P-NGLzMVSK/exec";


async function connectLINE() {

  const status =
    document.getElementById("status");

  try {

    status.textContent =
      "กำลังเริ่ม LINE...";


    await liff.init({
      liffId: LIFF_ID
    });


    /************************************************
     * ถ้ายังไม่ได้ Login
     ************************************************/

    if (!liff.isLoggedIn()) {

      status.textContent =
        "กำลังเปิด LINE Login...";

      liff.login();

      return;
    }


    /************************************************
     * ต้องใช้ ID TOKEN
     ************************************************/

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "ไม่สามารถอ่าน LINE ID Token ได้"
      );

    }


    status.textContent =
      "กำลังบันทึก LINE User...";


    /************************************************
     * ส่ง Token ไป Apps Script
     *
     * ใช้ no-cors เพราะ GitHub Pages
     * เป็นคนละ origin กับ Apps Script
     ************************************************/

    await fetch(
      GAS_API,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action:
            "saveLineUser",

          idToken:
            idToken

        })

      }
    );


    /************************************************
     * no-cors อ่าน response ไม่ได้
     *
     * ดังนั้นถือว่าส่งคำขอสำเร็จ
     ************************************************/

    status.textContent =
      "เชื่อมต่อ LINE สำเร็จ ✅";


  } catch (error) {

    console.error(error);

    status.textContent =
      "เชื่อมต่อ LINE ไม่สำเร็จ: " +
      (
        error.message ||
        error
      );

  }

}

</script>
