<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ACS LINE</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{
  box-sizing:border-box;
}

:root{
  --red:#c8102e;
  --red2:#ed1c3b;
  --dark:#161616;
  --gray:#777;
  --bg:#f7f7f7;
  --white:#fff;
  --line:#ededed;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    Arial,
    sans-serif;
  color:var(--dark);
  background:
    radial-gradient(circle at 15% 10%,rgba(200,16,46,.10),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(200,16,46,.07),transparent 30%),
    #f7f7f7;
  min-height:100vh;
}

.page{
  min-height:100vh;
  padding:24px 18px 40px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(0,0,0,.05);
  border-radius:30px;
  padding:34px 25px 28px;
  box-shadow:
    0 25px 70px rgba(0,0,0,.10),
    0 4px 15px rgba(0,0,0,.04);
  position:relative;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-90px;
  top:-90px;
  background:rgba(200,16,46,.10);
  border-radius:50%;
}

.logo{
  width:76px;
  height:76px;
  margin:0 auto 18px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:34px;
  background:linear-gradient(145deg,var(--red2),var(--red));
  box-shadow:0 12px 28px rgba(200,16,46,.28);
  position:relative;
}

.logo:after{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:19px;
}

h1{
  margin:0;
  text-align:center;
  font-size:29px;
  letter-spacing:-.5px;
}

.subtitle{
  text-align:center;
  color:var(--gray);
  margin:10px 0 26px;
  line-height:1.7;
}

.badge{
  width:max-content;
  margin:0 auto 24px;
  padding:7px 13px;
  border-radius:99px;
  background:#fff0f3;
  color:var(--red);
  font-size:13px;
  font-weight:700;
}

.connect{
  width:100%;
  border:0;
  padding:17px 20px;
  border-radius:17px;
  background:linear-gradient(135deg,var(--red2),var(--red));
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 12px 25px rgba(200,16,46,.24);
  transition:.2s;
}

.connect:active{
  transform:scale(.98);
}

.connect:disabled{
  opacity:.65;
}

.status{
  margin-top:20px;
  padding:17px;
  border-radius:17px;
  background:#fafafa;
  color:#555;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
}

.success{
  background:#f0faf4;
  color:#176b3a;
  border:1px solid #d8f0e0;
}

.error{
  background:#fff2f3;
  color:#a50019;
  border:1px solid #ffd6dc;
}

.profile{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(135deg,#fff5f6,#fff);
  border:1px solid #f5d5da;
}

.profile-name{
  font-size:18px;
  font-weight:800;
}

.profile-id{
  margin-top:7px;
  color:#777;
  font-size:12px;
  word-break:break-all;
}

.booking{
  display:none;
  margin-top:16px;
}

.booking button{
  width:100%;
  border:0;
  padding:16px;
  border-radius:16px;
  background:#151515;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.booking button:hover{
  background:var(--red);
}

.footer{
  text-align:center;
  color:#999;
  font-size:11px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="page">

<div class="card">

  <div class="logo">♥</div>

  <div class="badge">ACS SERVICE CENTER</div>

  <h1>ACS LINE</h1>

  <div class="subtitle">
    เชื่อมต่อ LINE ของคุณ<br>
    เพื่อใช้บริการจองคิวและนัดหมาย
  </div>

  <button
    id="connectBtn"
    class="connect"
    onclick="connectLINE()">
    เชื่อมต่อ LINE
  </button>

  <div id="status" class="status">
    พร้อมเชื่อมต่อ LINE
  </div>

  <div id="profile" class="profile">
    <div class="profile-name" id="profileName"></div>
    <div class="profile-id" id="profileId"></div>
  </div>

  <div id="booking" class="booking">

    <button onclick="goBooking()">
      📅 &nbsp; จองคิว / นัดหมาย
    </button>

  </div>

  <div class="footer">
    ACS Service Center · LINE Booking
  </div>

</div>

</div>

<script>

const LIFF_ID =
  "2011246207-sX1HgP1s";

const GAS_API =
  "https://script.google.com/macros/s/AKfycbwztzUCGN0AUy8bXUzG96o60Prt5hoMhZnght_xrlgC2lWfoEvszod_hYv28G8n9qOtuQ/exec";

let currentUserId = "";
let currentDisplayName = "";

const statusEl =
  document.getElementById("status");

const connectBtn =
  document.getElementById("connectBtn");

function status(text,type=""){
  statusEl.textContent = text;
  statusEl.className = "status";

  if(type){
    statusEl.classList.add(type);
  }
}

async function connectLINE(){

  connectBtn.disabled = true;

  try{

    status("กำลังเชื่อมต่อ LINE...");

    await liff.init({
      liffId: LIFF_ID
    });

    if(!liff.isLoggedIn()){

      status("กำลังเปิด LINE Login...");

      liff.login({
        redirectUri:window.location.href
      });

      return;
    }

    status("กำลังอ่านข้อมูล LINE...");

    const profile =
      await liff.getProfile();

    currentUserId =
      profile.userId || "";

    currentDisplayName =
      profile.displayName || "ลูกค้า ACS";

    if(!currentUserId){
      throw new Error(
        "ไม่พบ LINE User ID"
      );
    }

    const idToken =
      liff.getIDToken() || "";

    status(
      "กำลังบันทึกข้อมูล..."
    );

    const payload = {

      action:"saveLineUser",

      userId:currentUserId,

      displayName:currentDisplayName,

      idToken:idToken,

      source:"github-liff-bridge",

      timestamp:new Date().toISOString()

    };

    /*
     * ใช้ no-cors เพื่อให้ GitHub Pages
     * ส่งข้อมูลเข้า Google Apps Script ได้
     */
    await fetch(
      GAS_API,
      {
        method:"POST",
        mode:"no-cors",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:JSON.stringify(payload)
      }
    );

    status(
      "เชื่อมต่อ LINE สำเร็จ ✓\n" +
      "สามารถจองคิวได้แล้ว",
      "success"
    );

    document.getElementById(
      "profile"
    ).style.display = "block";

    document.getElementById(
      "profileName"
    ).textContent =
      "สวัสดีคุณ " +
      currentDisplayName;

    document.getElementById(
      "profileId"
    ).textContent =
      "LINE User ID: " +
      currentUserId;

    document.getElementById(
      "booking"
    ).style.display = "block";

    connectBtn.textContent =
      "✓ เชื่อมต่อแล้ว";

  }catch(error){

    console.error(error);

    status(
      "LINE เชื่อมต่อไม่สำเร็จ\n\n" +
      (error.message || error),
      "error"
    );

    connectBtn.disabled = false;
  }
}

function goBooking(){

  const url =
    "booking.html" +
    "?userId=" +
    encodeURIComponent(currentUserId) +
    "&displayName=" +
    encodeURIComponent(currentDisplayName);

  window.location.href = url;
}

</script>

</body>
</html>
