<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACS LINE Bridge</title>


  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background:
        #f3f7f5;

      color:
        #222;

    }


    .box {

      max-width: 560px;

      margin:
        30px auto;

      padding:
        30px;

      background:
        #ffffff;

      border-radius:
        22px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);

    }


    h1 {

      margin-top: 0;

      font-size: 32px;

    }


    .subtitle {

      font-size: 20px;

      line-height: 1.6;

      margin-bottom: 25px;

    }


    button {

      width: 100%;

      padding: 17px;

      border: 0;

      border-radius: 12px;

      background:
        #06c755;

      color:
        white;

      font-size: 21px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: .6;

      cursor:
        wait;

    }


    #status {

      margin-top: 25px;

      padding: 20px;

      border-radius: 15px;

      background:
        #f1f1f1;

      line-height: 1.7;

      font-size: 18px;

      word-break:
        break-word;

      white-space:
        pre-wrap;

    }


    .success {

      background:
        #e7f8ee !important;

      color:
        #08783e;

    }


    .error {

      background:
        #ffeded !important;

      color:
        #b00020;

    }


    .info {

      background:
        #eef5ff !important;

      color:
        #174ea6;

    }


    .user-id {

      font-size: 17px;

      word-break:
        break-all;

      margin-top: 10px;

    }

  </style>

</head>


<body>


<div class="box">

  <h1>
    💚 ACS LINE
  </h1>


  <div class="subtitle">

    เชื่อมต่อ LINE
    เพื่อใช้ข้อมูล LINE User ID
    กับระบบจองคิว

  </div>


  <button
    id="connectBtn"
    onclick="connectLINE()"
  >
    เชื่อมต่อ LINE
  </button>


  <div
    id="status"
    class="info"
  >
    กดปุ่ม
    "เชื่อมต่อ LINE"
    เพื่อเริ่มต้น
  </div>

</div>


<script>


/************************************************************
 * CONFIG
 ************************************************************/


const LIFF_ID =
  "2011246207-sX1HgP1s";


const GAS_API =
  "https://script.google.com/macros/s/AKfycbwztzUCGN0AUy8bXUzG96o60Prt5hoMhZnght_xrlgC2lWfoEvszod_hYv28G8n9qOtuQ/exec";


/************************************************************
 * ELEMENTS
 ************************************************************/


const statusEl =
  document.getElementById(
    "status"
  );


const connectBtn =
  document.getElementById(
    "connectBtn"
  );


/************************************************************
 * STATUS
 ************************************************************/


function setStatus(
  message,
  type
) {

  statusEl.textContent =
    message;


  statusEl.className = "";


  if (type) {

    statusEl.classList.add(
      type
    );

  }

}


/************************************************************
 * LIFF INIT
 *
 * มี timeout ป้องกัน
 * LIFF ค้างนานเกินไป
 ************************************************************/


async function initLIFF() {

  return Promise.race([

    liff.init({

      liffId:
        LIFF_ID

    }),


    new Promise(
      function(resolve, reject) {

        setTimeout(
          function() {

            reject(
              new Error(
                "LIFF init timeout 20 วินาที"
              )
            );

          },
          20000
        );

      }
    )

  ]);

}


/************************************************************
 * SEND DATA TO GAS
 ************************************************************/


async function saveToGAS(
  userId,
  displayName,
  pictureUrl,
  email
) {


  const payload = {

    action:
      "saveLineUser",

    userId:
      userId,

    displayName:
      displayName,

    pictureUrl:
      pictureUrl,

    email:
      email,

    source:
      "github-liff-bridge",

    timestamp:
      new Date().toISOString()

  };


  console.log(
    "Sending to GAS:",
    payload
  );


  /*
   * text/plain + no-cors
   *
   * ป้องกัน browser
   * ทำ CORS preflight
   */
  await fetch(

    GAS_API,

    {

      method:
        "POST",

      mode:
        "no-cors",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(
          payload
        )

    }

  );


  console.log(
    "GAS request sent"
  );

}


/************************************************************
 * CONNECT LINE
 ************************************************************/


async function connectLINE() {


  connectBtn.disabled =
    true;


  try {


    /******************************************************
     * STEP 1
     ******************************************************/

    setStatus(
      "1. กำลังเริ่ม LINE LIFF...",
      "info"
    );


    await initLIFF();


    console.log(
      "LIFF initialized"
    );


    console.log(
      "LIFF ID:",
      LIFF_ID
    );


    console.log(
      "isLoggedIn:",
      liff.isLoggedIn()
    );


    console.log(
      "isInClient:",
      liff.isInClient()
    );


    /******************************************************
     * STEP 2 - LOGIN
     ******************************************************/

    if (
      !liff.isLoggedIn()
    ) {


      setStatus(
        "2. กำลังเปิด LINE Login...\n\n" +
        "กรุณาเข้าสู่ระบบ LINE แล้วระบบจะกลับมาหน้านี้อัตโนมัติ",
        "info"
      );


      /*
       * สำคัญ:
       * ใช้ URL ปัจจุบัน
       */
      liff.login({

        redirectUri:
          window.location.href

      });


      return;

    }


    /******************************************************
     * STEP 3 - ID TOKEN
     ******************************************************/

    setStatus(
      "3. Login LINE สำเร็จ\nกำลังอ่านข้อมูล LINE...",
      "info"
    );


    const idToken =
      liff.getIDToken();


    console.log(
      "ID Token exists:",
      !!idToken
    );


    /*
     * บางกรณี profile ใช้งานได้
     * แต่ ID Token อาจไม่มี
     *
     * จึงไม่หยุดระบบเพียงเพราะ
     * ID Token ไม่มี
     */
    if (!idToken) {

      console.warn(
        "ไม่พบ ID Token"
      );

    }


    /******************************************************
     * STEP 4 - PROFILE
     ******************************************************/

    setStatus(
      "4. กำลังอ่าน LINE User ID...",
      "info"
    );


    const profile =
      await liff.getProfile();


    console.log(
      "LINE profile:",
      profile
    );


    const userId =
      String(
        profile.userId || ""
      ).trim();


    const displayName =
      String(
        profile.displayName || ""
      ).trim();


    const pictureUrl =
      String(
        profile.pictureUrl || ""
      ).trim();


    /*
     * Email
     *
     * ถ้า LIFF มี decoded ID token
     * และมี email ก็จะเก็บไว้
     */
    let email = "";


    try {

      if (
        typeof liff.getDecodedIDToken ===
        "function"
      ) {

        const decoded =
          liff.getDecodedIDToken();


        if (
          decoded &&
          decoded.email
        ) {

          email =
            String(
              decoded.email
            ).trim();

        }

      }

    } catch (emailError) {

      console.warn(
        "ไม่สามารถอ่าน email:",
        emailError
      );

    }


    console.log(
      "LINE User ID:",
      userId
    );


    console.log(
      "Display Name:",
      displayName
    );


    /******************************************************
     * CHECK USER ID
     ******************************************************/

    if (!userId) {

      throw new Error(
        "ไม่สามารถอ่าน LINE User ID ได้"
      );

    }


    /******************************************************
     * STEP 5 - SAVE
     ******************************************************/

    setStatus(
      "5. กำลังบันทึก LINE User ID ลงระบบ...",
      "info"
    );


    await saveToGAS(

      userId,

      displayName,

      pictureUrl,

      email

    );


    /******************************************************
     * STEP 6 - SUCCESS
     ******************************************************/

    setStatus(

      "6. เชื่อมต่อ LINE สำเร็จ ✅\n\n" +

      "ชื่อ: " +
      displayName +
      "\n\n" +

      "LINE User ID:\n" +
      userId +
      "\n\n" +

      "ส่งข้อมูลไปยังระบบแล้ว\n" +

      "สามารถกลับไปใช้งานระบบจองคิวได้",

      "success"

    );


    console.log(
      "LINE connection completed"
    );


    /*
     * ไม่ต้องเปิด LINE Login ซ้ำ
     */
    connectBtn.textContent =
      "เชื่อมต่อ LINE สำเร็จ ✓";


  } catch (error) {


    console.error(
      "LINE ERROR:",
      error
    );


    setStatus(

      "เชื่อมต่อ LINE ไม่สำเร็จ\n\n" +

      (
        error &&
        error.message
          ? error.message
          : String(error)
      ) +

      "\n\n" +

      "LIFF ID: " +
      LIFF_ID +

      "\n" +

      "หน้านี้: " +
      window.location.href,

      "error"

    );


    connectBtn.disabled =
      false;


    connectBtn.textContent =
      "ลองเชื่อมต่อ LINE อีกครั้ง";

  }

}


/************************************************************
 * PAGE LOAD
 ************************************************************/


window.addEventListener(
  "load",
  function() {

    console.log(
      "================================"
    );

    console.log(
      "ACS LINE Bridge loaded"
    );

    console.log(
      "LIFF ID:",
      LIFF_ID
    );

    console.log(
      "GAS API:",
      GAS_API
    );

    console.log(
      "PAGE:",
      window.location.href
    );

    console.log(
      "================================"
    );

  }
);


</script>


</body>

</html>
